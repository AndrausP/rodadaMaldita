<title>Rodada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@400;600;800;900&display=swap">
<style>
:root{
  color-scheme: dark;
  --ink:#12142B; --ink-2:#1C1F44; --ink-3:#272B5C;
  --line:#07081A;
  --paper:#FFF3E3; --paper-ink:#1A1530;
  --text:#F2EEFF; --muted:#A7A3D1;
  --coral:#FF5A6E; --sun:#FFC23C; --mint:#3DD6B5; --lilac:#A99BFF;
  --good:#3DD6B5; --bad:#FF5A6E;
  --display:"Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ink); color:var(--text); font-family:var(--body); font-size:16px; line-height:1.45;
  background-image:radial-gradient(rgba(169,155,255,.13) 1.2px, transparent 1.4px);
  background-size:22px 22px;
  -webkit-tap-highlight-color:transparent;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
#app{max-width:580px;margin:0 auto;padding-inline:16px;padding-block:18px 40px;min-height:100%;display:flex;flex-direction:column;gap:18px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-size:30px;letter-spacing:.5px;line-height:1;display:flex;gap:1px;background:none;border:0;padding:0}
.logo span{display:inline-block;transform:rotate(var(--rot,0deg))}
.logo span:nth-child(1){color:var(--coral);--rot:-6deg}
.logo span:nth-child(2){color:var(--sun);--rot:4deg}
.logo span:nth-child(3){color:var(--mint);--rot:-3deg}
.logo span:nth-child(4){color:var(--lilac);--rot:5deg}
.logo span:nth-child(5){color:var(--coral);--rot:-4deg}
.logo span:nth-child(6){color:var(--sun);--rot:3deg}
.icon-btn{width:42px;height:42px;border-radius:12px;border:3px solid var(--line);background:var(--ink-3);box-shadow:0 4px 0 var(--line);display:grid;place-items:center}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.icon-btn svg{width:20px;height:20px}
.bar-left{display:flex;align-items:center;gap:10px}

/* type */
h1,h2,h3{margin:0;text-wrap:balance}
.h-display{font-family:var(--display);font-weight:400;line-height:1.02;letter-spacing:.2px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* buttons */
.btn{
  --bg:var(--sun); --fg:var(--paper-ink);
  appearance:none;border:3px solid var(--line);background:var(--bg);color:var(--fg);
  border-radius:16px;padding:14px 20px;font-weight:900;font-size:17px;box-shadow:0 6px 0 var(--line);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s, box-shadow .08s;
  user-select:none;-webkit-user-select:none;
}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.block{width:100%}
.btn.big{font-size:21px;padding:18px 22px;border-radius:20px}
.btn.ghost{--bg:var(--ink-3);--fg:var(--text)}
.btn.coral{--bg:var(--coral);--fg:#fff}
.btn.mint{--bg:var(--mint)}
.btn.lilac{--bg:var(--lilac)}
.btn.paper{--bg:var(--paper)}

/* panel */
.panel{background:var(--ink-2);border:3px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 6px 0 var(--line)}

/* players */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:7px 8px 7px 12px;border-radius:999px;border:2px solid var(--line);
  background:var(--ink-3);font-weight:700;font-size:15px
}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--lilac));border:2px solid var(--line)}
.chip button{border:0;background:transparent;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:16px;line-height:1;padding:0}
.chip button:hover{background:rgba(255,255,255,.1);color:var(--text)}
.add{display:flex;gap:8px}
.input{
  flex:1;min-width:0;border:3px solid var(--line);background:var(--ink);border-radius:14px;padding:12px 14px;font-weight:600;font-size:16px;
}
.input::placeholder{color:#6E6A9E}
.add .btn{padding:10px 16px;box-shadow:0 4px 0 var(--line)}

/* game cards on home */
.games{display:grid;gap:16px}
.game{
  position:relative;text-align:left;border:3px solid var(--line);border-radius:22px;padding:18px 18px 18px;
  background:var(--bg);color:var(--paper-ink);box-shadow:0 7px 0 var(--line);overflow:hidden;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;
  transition:transform .12s;
}
.game:hover{transform:rotate(-.6deg) translateY(-2px)}
.game:active{transform:translateY(5px);box-shadow:0 2px 0 var(--line)}
.game[disabled]{filter:saturate(.35);opacity:.7}
.game h2{font-family:var(--display);font-weight:400;font-size:32px;line-height:1}
.game p{margin:0;font-weight:600;font-size:15px;max-width:34ch}
.game .meta{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:2px solid var(--line);background:rgba(255,255,255,.55)}
.game .art{grid-row:1/3;grid-column:2;width:76px;height:76px}
.game.coral{--bg:var(--coral)} .game.sun{--bg:var(--sun)} .game.mint{--bg:var(--mint)}

/* segmented + toggles */
.field{display:flex;flex-direction:column;gap:8px}
.field > label, .field > .label{font-weight:800;font-size:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{
  border:2px solid var(--line);background:var(--ink-3);border-radius:12px;padding:9px 13px;font-weight:800;font-size:15px;
}
.seg button[aria-pressed="true"]{background:var(--accent,var(--sun));color:var(--paper-ink);box-shadow:0 3px 0 var(--line)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.switch button{width:56px;height:32px;border-radius:999px;border:3px solid var(--line);background:var(--ink-3);position:relative;flex:none;padding:0}
.switch button::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:left .15s, background .15s}
.switch button[aria-pressed="true"]{background:var(--accent,var(--sun))}
.switch button[aria-pressed="true"]::after{left:26px;background:var(--line)}
.hint{font-size:13px;color:var(--muted);margin:0}

/* big play card */
.card{
  background:var(--paper);color:var(--paper-ink);border:3px solid var(--line);border-radius:26px;box-shadow:0 9px 0 var(--line);
  padding:26px 22px;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;position:relative;overflow:hidden
}
.card .corner{position:absolute;top:14px;left:16px;font-family:var(--display);font-size:20px;color:var(--c,var(--coral))}
.card .corner.r{left:auto;right:16px;top:auto;bottom:14px;transform:rotate(180deg)}
.word{font-family:var(--display);font-weight:400;font-size:clamp(38px,11vw,64px);line-height:1;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;border:2px solid var(--line);font-weight:900;font-size:13px;letter-spacing:.08em;text-transform:uppercase;background:var(--c,var(--sun));color:var(--paper-ink)}

/* hold to reveal */
.hold{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.hold .front,.hold .back{display:flex;flex-direction:column;align-items:center;gap:12px}
.hold .back{display:none}
.hold.on .front{display:none}
.hold.on .back{display:flex}
.hold.on{background:#fff}
.fingerprint{width:86px;height:86px;border-radius:50%;border:3px dashed var(--paper-ink);display:grid;place-items:center;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.imp-badge{font-family:var(--display);font-size:clamp(36px,10vw,54px);color:var(--coral);line-height:1;-webkit-text-stroke:2px var(--line);paint-order:stroke fill}

.pass{font-family:var(--display);font-size:clamp(30px,8vw,44px);line-height:1.05}
.pass em{font-style:normal;color:var(--sun)}
.progress-dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.progress-dots i{width:10px;height:10px;border-radius:50%;background:var(--ink-3);border:2px solid var(--line)}
.progress-dots i.done{background:var(--mint)}
.progress-dots i.cur{background:var(--sun)}

/* timer ring */
.ring{position:relative;width:min(70vw,260px);aspect-ratio:1;margin:0 auto;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:clamp(48px,15vw,72px);font-variant-numeric:tabular-nums}
.ring.urgent .num{color:var(--coral);animation:shake .5s infinite}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}

/* vote grid */
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.vote{border:3px solid var(--line);background:var(--ink-3);border-radius:16px;padding:16px 12px;font-weight:900;font-size:17px;box-shadow:0 5px 0 var(--line);overflow-wrap:anywhere}
.vote:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}

/* scoreboard */
.scores{display:flex;flex-direction:column;gap:8px}
.score{display:grid;grid-template-columns:28px 1fr auto auto;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--ink-3);border:2px solid var(--line);font-weight:800}
.score .pos{font-family:var(--display);color:var(--muted)}
.score .pts{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.delta{font-size:13px;font-weight:900;padding:2px 8px;border-radius:999px;background:var(--mint);color:var(--paper-ink);border:2px solid var(--line)}
.delta.zero{visibility:hidden}
.score.top{background:var(--sun);color:var(--paper-ink)}
.score.top .pos{color:var(--paper-ink)}

/* correria play */
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px}
.teamtag{display:inline-flex;align-items:center;gap:8px;font-weight:900}
.teamtag .dot{width:14px;height:14px;border-radius:50%;background:var(--c);border:2px solid var(--line)}
.tbar{height:16px;border-radius:999px;border:3px solid var(--line);background:var(--ink-3);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--sun);transform-origin:left;transition:transform .25s linear}
.tbar.urgent i{background:var(--coral)}
.clock{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.playbtns{display:grid;grid-template-columns:1fr 1.6fr;gap:12px}
.flash-good{animation:good .35s}
.flash-skip{animation:skip .35s}
@keyframes good{0%{transform:scale(.94) rotate(-2deg);background:#D9FFF4}100%{transform:none}}
@keyframes skip{0%{transform:translateX(-18px) rotate(-3deg);opacity:.5}100%{transform:none}}
.review{display:flex;flex-direction:column;gap:8px}
.review button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:2px solid var(--line);border-radius:14px;padding:11px 14px;font-weight:800;background:var(--ink-3)}
.review button .st{font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:2px solid var(--line)}
.review button.ok .st{background:var(--mint);color:var(--paper-ink)}
.review button.no .st{background:var(--ink);color:var(--muted)}
.review button.no{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px}
.teams-edit{display:flex;flex-direction:column;gap:8px}
.teams-edit .t{display:flex;gap:8px;align-items:center}
.teams-edit .sw{width:18px;height:18px;border-radius:50%;background:var(--c);border:2px solid var(--line);flex:none}

/* cartas */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--ink-2);border:3px solid var(--line);border-radius:16px;padding:5px}
.tabs button{border:0;background:transparent;border-radius:11px;padding:10px 6px;font-weight:900;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--mint);color:var(--paper-ink)}
.prompt{font-family:var(--display);font-size:clamp(28px,7.4vw,40px);line-height:1.08;text-wrap:balance}
.prompt small{display:block;font-family:var(--body);font-weight:800;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:#6C6690;margin-bottom:10px}
.wyr{display:grid;gap:0;width:100%}
.wyr .opt{font-family:var(--display);font-size:clamp(24px,6.4vw,34px);line-height:1.08;padding:18px 12px;border-radius:16px;border:3px solid var(--line)}
.wyr .opt.a{background:var(--coral);color:#fff}
.wyr .opt.b{background:var(--sun)}
.wyr .ou{font-family:var(--display);font-size:22px;margin:-12px auto;z-index:1;background:var(--paper);border:3px solid var(--line);border-radius:50%;width:54px;height:54px;display:grid;place-items:center}
.counter{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}

/* overlay countdown */
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(7,8,26,.82);z-index:50}
.overlay .n{font-family:var(--display);font-size:min(46vw,260px);color:var(--sun);animation:pop .9s ease-out both;-webkit-text-stroke:5px var(--line);paint-order:stroke fill}
.overlay .n.go{color:var(--mint);font-size:min(22vw,130px);text-align:center;line-height:1}
@keyframes pop{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}

.center{text-align:center}
.spacer{flex:1}
.enter{animation:enter .28s ease-out both}
@keyframes enter{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--text)}
.rules li::marker{color:var(--sun);font-weight:900}
details.panel summary{font-weight:900;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.panel summary::after{content:"+";font-family:var(--display);color:var(--sun)}
details[open].panel summary::after{content:"–"}
details.panel[open] summary{margin-bottom:12px}
.foot{font-size:13px;color:var(--muted);text-align:center}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
@media (min-width:640px){
  .games{grid-template-columns:1fr}
}
</style>

<div id="app"></div>

<script>
/* ======================= CONTEÚDO ======================= */
const CATS = {

};
const CAT_NAMES = Object.keys(CATS);

async function keepAwake(on){
  try{
    if(on && !wake && navigator.wakeLock){wake=await navigator.wakeLock.request("screen");wake.addEventListener?.("release",()=>wake=null)}

}

let actx=null;
function audio(){ if(!S.sound) return null; try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); return actx }catch(e){return null} }
function tone(freq,dur=.12,type="sine",vol=.18,when=0,slide=0){
  const a=audio(); if(!a) return;
  const t=a.currentTime+when, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.02);
}
const sfx={
  tap:()=>tone(520,.06,"triangle",.1),
  good:()=>{tone(660,.1,"triangle",.2);tone(990,.16,"triangle",.2,.08)},
  skip:()=>tone(300,.14,"sawtooth",.08,0,180),
  tick:()=>tone(1100,.04,"square",.06),
  count:()=>tone(440,.12,"triangle",.18),
  go:()=>{tone(880,.25,"triangle",.22)},
  buzz:()=>{tone(160,.6,"sawtooth",.2);tone(120,.6,"square",.08)},
  reveal:()=>tone(200,.3,"sine",.15,0,700),
  win:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.22,"triangle",.2,i*.12))},
  bad:()=>{tone(400,.18,"triangle",.18,0,200);tone(300,.3,"triangle",.18,.16,150)}
};

/* ======================= CONFETE ======================= */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=$("#confetti"),x=c.getContext("2d"),dpr=devicePixelRatio||1;
  c.width=innerWidth*dpr;c.height=innerHeight*dpr;x.scale(dpr,dpr);
  const cols=["#FF5A6E","#FFC23C","#3DD6B5","#A99BFF","#FFF3E3"];
  const P=Array.from({length:140},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.4,w:6+Math.random()*8,h:4+Math.random()*6,c:pick(cols)}));
  let f=0;(function loop(){x.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});if(++f<170)requestAnimationFrame(loop);else x.clearRect(0,0,innerWidth,innerHeight)})();
}

function scoreboard(rows,title){

}
function impStart(){
  const I=S.imp, pool=(I.cats.length?I.cats:CAT_NAMES);
  let options=[];pool.forEach(c=>CATS[c].forEach(w=>options.push([c,w])));
  let fresh=options.filter(o=>!I.used.includes(o[1])); if(!fresh.length){I.used=[];fresh=options}
  const [cat,word]=pick(fresh); I.used.push(word);
  const idx=shuffle(S.players.map((_,i)=>i));
  I.round={cat,word,impostors:idx.slice(0,I.impCount),order:S.players.slice(),reveal:0,seen:false,starter:pick(S.players),dir:Math.random()<.5?"horário":"anti-horário",voted:null,guessed:null,deltas:{},timeLeft:I.minutes*60,total:I.minutes*60};
  go("impReveal");
}

function bindHold(){
  const el=$("#holdCard"); if(!el) return;
  const on=e=>{e.preventDefault();if(!el.classList.contains("on")){el.classList.add("on");sfx.reveal()}S.imp.round.seen=true;$("#nextBtn").disabled=false};
  const off=()=>el.classList.remove("on");
  el.addEventListener("pointerdown",e=>{el.setPointerCapture?.(e.pointerId);on(e)});
  ["pointerup","pointercancel","lostpointercapture"].forEach(t=>el.addEventListener(t,off));
  el.addEventListener("contextmenu",e=>e.preventDefault());
  el.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter")on(e)});
  el.addEventListener("keyup",off); el.addEventListener("blur",off);
}

function impScore(){
  const R=S.imp.round, I=S.imp, d={};
  const add=(i,p)=>{const n=R.order[i];d[n]=(d[n]||0)+p;I.scores[n]=(I.scores[n]||0)+p};
  const caught=R.voted>=0&&R.impostors.includes(R.voted);
  R.impostors.forEach(i=>{ if(i!==R.voted) add(i,2) });
  if(caught){
    if(R.guessed) add(R.voted,1);
    else R.order.forEach((_,i)=>{ if(!R.impostors.includes(i)) add(i,1) });
  }
  R.caught=caught; R.deltas=d;
  S.players.forEach(p=>{ if(!(p in I.scores)) I.scores[p]=I.scores[p]||0 });
}

function corNextWord(){
  const C=S.cor, pool=C.cats.length?C.cats:CAT_NAMES;
  let opts=[];pool.forEach(c=>CATS[c].forEach(w=>opts.push([c,w])));
  let fresh=opts.filter(o=>!C.used.includes(o[1])); if(!fresh.length){C.used=[];fresh=opts}
  const [cat,word]=pick(fresh); C.used.push(word);
  const mode=C.mode==="mix"?(Math.random()<.62?"fala":"mimica"):C.mode;
  return {cat,word,mode,ok:null};
}

function countdown(label,done){
  sfx.tap();
  const o=document.createElement("div");o.className="overlay";document.body.appendChild(o);
  const seq=["3","2","1",label]; let i=0;
  const step=()=>{
    if(i<seq.length){const last=i===seq.length-1;o.innerHTML=`<div class="n ${last?"go":""}">${seq[i]}</div>`;last?sfx.go():sfx.count();i++;setTimeout(step,last?750:800)}
    else{o.remove();done&&done()}
  };
  o.addEventListener("click",()=>{i=seq.length;o.remove();done&&done();done=null});
  step();
}

/* ======================= NAVEGAÇÃO / AÇÕES ======================= */
function go(screen){ stopTimer(); if(!["impTalk","corPlay"].includes(screen)) keepAwake(false); S.screen=screen; render(); window.scrollTo({top:0}); }
function render(){
  $("#app").innerHTML=screens[S.screen]();
  if(S.screen==="impReveal") bindHold();
  if(S.screen==="impTalk") runTalkTimer();
  if(S.screen==="corPlay") runCorTimer();
}
function toggleIn(arr,v){ if(!v) return []; const i=arr.indexOf(v); if(i>=0) arr.splice(i,1); else arr.push(v); return arr }

const actions={
  sound(){S.sound=!S.sound;store.set("sound",S.sound);render();sfx.tap()},
  rmPlayer(el){const n=S.players[+el.dataset.i];S.players.splice(+el.dataset.i,1);delete S.imp.scores[n];savePlayers();render()},
  clearPlayers(){S.players=[];S.imp.scores={};savePlayers();render();setTimeout(()=>$("#newPlayer")?.focus(),0)},
  impCat(el){S.imp.cats=toggleIn(S.imp.cats,el.dataset.v);render()},
  impCount(el){S.imp.impCount=+el.dataset.v;render()},
  impMin(el){S.imp.minutes=+el.dataset.v;render()},
  impShowCat(){S.imp.showCat=!S.imp.showCat;render()},
  impStart(){if(S.players.length<3){go("home");return}sfx.tap();impStart()},
  impNext(){const R=S.imp.round;if(!R.seen)return;sfx.tap();if(R.reveal<R.order.length-1){R.reveal++;R.seen=false;render()}else{sfx.go();go("impTalk")}},
  impAdd(){const R=S.imp.round;R.timeLeft+=30;R.total=Math.max(R.total,R.timeLeft);sfx.tap()},
  impVote(){sfx.tap();go("impVote")},
  impPick(el){const R=S.imp.round;R.voted=+el.dataset.i;
    if(R.voted>=0&&R.impostors.includes(R.voted)){sfx.win();confetti();go("impGuess")}
    else{R.guessed=null;impScore();sfx.bad();go("impResult")}},
  impGuess(el){const R=S.imp.round;R.guessed=el.dataset.v==="1";impScore();R.guessed?sfx.bad():sfx.win();go("impResult")},
  impReset(){S.imp.scores={};render()},

  corAddTeam(){const C=S.cor;const i=C.teams.length;if(i>=4)return;const id=Math.max(...C.teams.map(t=>t.id))+1;C.teams.push({id,name:TEAM_DEFAULTS[i],score:0});render()},
  corRmTeam(el){S.cor.teams.splice(+el.dataset.i,1);render()},
  corMode(el){S.cor.mode=el.dataset.v;render()},
  corSec(el){S.cor.seconds=+el.dataset.v;render()},
  corTarget(el){S.cor.target=+el.dataset.v;render()},
  corCat(el){S.cor.cats=toggleIn(S.cor.cats,el.dataset.v);render()},
  corStart(){const C=S.cor;C.teams.forEach((t,i)=>{t.name=(t.name||"").trim()||TEAM_DEFAULTS[i];t.score=0});C.turnIdx=0;C.winner=null;sfx.tap();go("corReady")},
  corGo(){countdown("Já!",()=>{S.cor.turn={left:S.cor.seconds,cards:[corNextWord()]};go("corPlay")})},
  corOk(){const T=S.cor.turn;if(!T||T.left<=0)return;T.cards[T.cards.length-1].ok=true;T.cards.push(corNextWord());sfx.good();swapCard("flash-good")},
  corSkip(){const T=S.cor.turn;if(!T||T.left<=0)return;T.cards[T.cards.length-1].ok=false;T.cards.push(corNextWord());sfx.skip();swapCard("flash-skip")},
  corToggle(el){const c=S.cor.turn.cards[+el.dataset.i];c.ok=!c.ok;sfx.tap();render()},
  corConfirm(){
    const C=S.cor, i=C.turnIdx%C.teams.length, got=C.turn.cards.filter(c=>c.ok).length;
    C.teams[i].score+=got; C.turnIdx++; C.turn=null;
    if(C.turnIdx%C.teams.length===0){
      const max=Math.max(...C.teams.map(t=>t.score)), leaders=C.teams.map((t,k)=>t.score===max?k:-1).filter(k=>k>=0);
      if(max>=C.target&&leaders.length===1){C.winner=leaders[0];sfx.win();confetti();go("corWin");return}
    }
    go("corReady");
  },

  carDeck(el){S.car.deck=el.dataset.v;sfx.tap();render()},
  carNext(){const K=S.car,d=K.deck;K.idx[d]++;if(K.idx[d]>=DECKS[d].data.length){K.order[d]=shuffle(DECKS[d].data.map((_,i)=>i));K.idx[d]=0}sfx.tap();render()},
  carShuffle(){const d=S.car.deck;S.car.order[d]=null;carCurrent();render()},
  carCount(){countdown("Já!")}
};
function swapCard(cls){
  const T=S.cor.turn, w=T.cards[T.cards.length-1], card=$("#corCard"); if(!card) return;
  const got=T.cards.filter(c=>c.ok).length;
  card.querySelector(".word").textContent=w.word;
  card.querySelector("#corCat").textContent=w.cat;
  const p=card.querySelector(".pill"); p.textContent=w.mode==="fala"?"Explique":"Mímica"; p.style.setProperty("--c",w.mode==="fala"?"var(--sun)":"var(--lilac)");
  const hp=document.querySelector(".hud .pill"); if(hp) hp.textContent=`${got} ${got===1?"ponto":"pontos"}`;
  card.classList.remove("flash-good","flash-skip"); void card.offsetWidth; card.classList.add(cls);
}
